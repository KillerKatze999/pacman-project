<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tile Map Cleaner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
    }

    textarea {
      width: 100%;
      margin-bottom: 1em;
      font-family: monospace;
    }

    button {
      margin-right: 1em;
      padding: 0.5em 1em;
    }

    #tileMapOptions {
      margin-bottom: 1em;
    }
  </style>
  <script src="https://unpkg.com/acorn@8.11.3/dist/acorn.js"></script>
</head>

<body>
  <h1>🧹 Clean Code & Select Tile Maps to Remove</h1>
  <textarea id="inputCode" rows="10" placeholder="Paste your code here..."></textarea>
  <div>
    <button onclick="detectTileMaps()">Detect Tile Maps</button>
    <button onclick="detectFunctions()">Detect Functions</button>
    <button onclick="removeCommentsAndConsole()">Clean Code</button>
    <button onclick="cleanAll()">Clear All</button>
  </div>

  <div id="tileMapOptions"></div>
  <div id="functionOptions" style="margin-bottom: 1em;"></div>

  <textarea id="outputCode" rows="10" placeholder="Cleaned code will appear here..."></textarea>

  <script>
    function detectTileMaps() {
      const inputCode = document.getElementById("inputCode").value;
      // const tileMapRegex = /(?:const|let)\s+(tileMap\d+)\s*=\s*\[[\s\S]*?\];/gm;
      const tileMapRegex = /(?:const|let)\s+([a-zA-Z_$][\w$]*)\s*=\s*\[[\s\S]*?\];/gm;
      const matches = [...inputCode.matchAll(tileMapRegex)];

      const container = document.getElementById("tileMapOptions");
      container.innerHTML = "<strong>Select tile maps to remove:</strong><br>";

      matches.forEach(match => {
        const name = match[1];
        const checkbox = `<label><input type="checkbox" value="${name}"> ${name}</label><br>`;
        container.innerHTML += checkbox;
      });

      if (matches.length === 0) {
        container.innerHTML = "<em>No tile maps detected.</em>";
      }
    }

    function detectFunctions() {
      const inputCode = document.getElementById("inputCode").value;
      const container = document.getElementById("functionOptions");

      console.log("Code being parsed:", inputCode);


      container.innerHTML = "<strong>Select functions to remove:</strong><br>";

      let ast;
      try {
        ast = window.acorn.parse(inputCode, { ecmaVersion: 2020, sourceType: "script" });
      } catch (e) {
        container.innerHTML = "<em>Error parsing code.</em>";
        console.error(e);
        return;
      }

      const seenFunctions = new Set();

      walkAST(ast, node => {
        // 1. Regular named function
        if (node.type === "FunctionDeclaration" && node.id && node.id.name) {
          seenFunctions.add(node.id.name);
        }

        // 2. const fn = function() {} or const fn = () => {}
        else if (
          node.type === "VariableDeclarator" &&
          node.id?.name &&
          node.init &&
          (node.init.type === "FunctionExpression" || node.init.type === "ArrowFunctionExpression")
        ) {
          seenFunctions.add(node.id.name);
        }

        // 3. Object method or function assigned in object
        else if (
          node.type === "Property" &&
          ((node.value && node.value.type === "FunctionExpression") || node.method === true) &&
          node.key?.name
        ) {
          seenFunctions.add(node.key.name);
        }

        // 4. Class methods
        else if (
          node.type === "MethodDefinition" &&
          node.key?.name &&
          (node.kind === "method" || node.kind === "constructor")
        ) {
          seenFunctions.add(node.key.name);
        }
      });

      if (seenFunctions.size === 0) {
        container.innerHTML = "<em>No functions detected.</em>";
        return;
      }

      for (let fnName of seenFunctions) {
        const checkbox = `<label><input type="checkbox" value="${fnName}"> ${fnName}</label><br>`;
        container.innerHTML += checkbox;
      }

      console.log("Detected functions:", Array.from(seenFunctions));
    }

    function walkAST(node, callback) {
      if (!node || typeof node.type !== "string") return;

      // Debug log to see what it's walking
      console.log("Visiting node:", node.type);

      callback(node);

      for (const key in node) {
        if (Object.prototype.hasOwnProperty.call(node, key)) {
          const child = node[key];

          if (Array.isArray(child)) {
            for (const c of child) {
              if (c && typeof c.type === "string") {
                walkAST(c, callback);
              }
            }
          } else if (child && typeof child.type === "string") {
            walkAST(child, callback);
          }
        }
      }
    }




    function removeCommentsAndConsole() {
      let inputCode = document.getElementById("inputCode").value;

      // Remove multi-line comments
      inputCode = inputCode.replace(/\/\*[\s\S]*?\*\//g, '');

      // Remove selected tile maps
      const checkboxes = document.querySelectorAll('#tileMapOptions input[type="checkbox"]:checked');
      checkboxes.forEach(cb => {
        const name = cb.value;
        const tileMapPattern = new RegExp(`(?:const|let)\\s+${name}\\s*=\\s*\\[[\\s\\S]*?\\];`, 'gm');
        inputCode = inputCode.replace(tileMapPattern, '');
      });

      // Remove selected functions
      const fnCheckboxes = document.querySelectorAll('#functionOptions input[type="checkbox"]:checked');
      fnCheckboxes.forEach(cb => {
        const fn = cb.value;
        const fnPattern = new RegExp(`function\\s+${fn}\\s*\\([^)]*\\)\\s*\\{[\\s\\S]*?\\}`, 'gm');
        inputCode = inputCode.replace(fnPattern, '');

        const callPattern = new RegExp(`${fn}\\s*\\([^)]*\\);?`, 'gm');
        inputCode = inputCode.replace(callPattern, '');
      });

      const lines = inputCode.split('\n');
      const cleanedLines = lines.map(line => {
        // Remove single-line comments
        const commentIndex = line.indexOf("//");
        if (commentIndex !== -1) line = line.slice(0, commentIndex);

        // Remove console codes
        line = line.replace(/System\.Console\.Write\("\\x1b\[\d+m"\);/g, '');

        // Remove XML comments
        line = line.replace(/\/{3}\s*<(summary|param|returns)[^>]*>[\s\S]*?<\/\1>/g, '');

        // Remove HTML comments
        line = line.replace(/<!--[\s\S]*?-->/gm, '');

          // Trim trailing spaces
          line = line.replace(/\s+$/, '');

        return line;
      }).filter(line => line.trim() !== '');

      document.getElementById("outputCode").value = cleanedLines.join('\n');
    }


    function cleanAll() {
      document.getElementById("inputCode").value = '';
      document.getElementById("outputCode").value = '';
      document.getElementById("tileMapOptions").innerHTML = '';
    }
  </script>
</body>
